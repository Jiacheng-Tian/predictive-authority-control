[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-authority-control"
version = "0.1.0"
description = "Predictive Authority Control for simulated AUV trajectory tracking"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "osqp==1.1.3",
    "pandas>=2.0.0",
    "PyYAML>=6.0.0",
    "scipy>=1.11.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
