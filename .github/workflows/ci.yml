name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . -r requirements-lock.txt pytest
      # one wall-clock deadline test is hardware-timing sensitive; excluded on CI
      - run: python -m pytest tests -q --no-header
            -k "not test_constant_alpha_policy_on_ou_episode"
